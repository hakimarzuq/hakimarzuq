<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 250" width="580" height="250" role="img" aria-label="Project 03 - Indie Game Prototype">
  <defs>
    <linearGradient id="cardBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071324"/>
      <stop offset="100%" stop-color="#112947"/>
    </linearGradient>
    <linearGradient id="headerBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1A30"/>
      <stop offset="100%" stop-color="#2B6294"/>
    </linearGradient>
    <clipPath id="cardClip3">
      <rect x="1" y="1" width="578" height="248" rx="16"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="578" height="248" rx="16" fill="url(#cardBg3)"/>

  <g clip-path="url(#cardClip3)">
    <!-- Header Visual Zone -->
    <rect x="0" y="0" width="580" height="96" fill="url(#headerBg3)"/>
    <path d="M 0,96 C 160,55 310,98 455,64 C 515,50 550,62 580,52 L 580,96 Z" fill="#0B192C" fill-opacity="0.75"/>
    <path d="M 0,90 C 165,49 315,92 460,58 C 518,44 552,56 580,46" fill="none" stroke="#A9D6E5" stroke-opacity="0.45" stroke-width="1.5"/>

    <!-- Minimal Gamepad / Interactive Emblem -->
    <g transform="translate(495, 48)" stroke="#A9D6E5" fill="none">
      <rect x="-28" y="-16" width="56" height="32" rx="14" fill="#122B4A" fill-opacity="0.75" stroke-width="1.5"/>
      <line x1="-14" y1="-6" x2="-14" y2="6" stroke="#F4F8FB" stroke-width="2" stroke-linecap="round"/>
      <line x1="-20" y1="0" x2="-8" y2="0" stroke="#F4F8FB" stroke-width="2" stroke-linecap="round"/>
      <circle cx="11" cy="-4" r="2.6" fill="#7DD3FC" stroke="none"/>
      <circle cx="18" cy="3" r="2.6" fill="#F4F8FB" stroke="none"/>
    </g>

    <!-- Header Pills -->
    <rect x="22" y="18" width="114" height="24" rx="7" fill="#071324" fill-opacity="0.85" stroke="#4A8DB7" stroke-opacity="0.7" stroke-width="1"/>
    <text x="79" y="34" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1" fill="#A9D6E5">ROADMAP / 03</text>

    <rect x="444" y="18" width="112" height="24" rx="12" fill="#0A223D" stroke="#4A8DB7" stroke-width="1"/>
    <circle cx="458" cy="30" r="3.5" fill="#7DD3FC"/>
    <text x="506" y="34" text-anchor="middle" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8" fill="#E0F2FE">NEXT UP</text>

    <!-- Body Content -->
    <text x="24" y="130" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#F4F8FB">Indie Game Prototype</text>
    <text x="24" y="149" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.2" fill="#6BAAD0">GAMEPLAY  •  WORLD BUILDING  •  REAL-TIME 3D</text>

    <text x="24" y="176" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#CBD5E1">Hands-on prototypes exploring player movement, physics,</text>
    <text x="24" y="194" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#CBD5E1">level atmosphere, and interactive storytelling mechanics.</text>

    <!-- Footer Tech Tags -->
    <g transform="translate(24, 212)">
      <rect x="0" y="0" width="76" height="24" rx="6" fill="#132F52" stroke="#2F6690" stroke-width="1"/>
      <text x="38" y="15.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600" fill="#A9D6E5">UNITY</text>

      <rect x="84" y="0" width="76" height="24" rx="6" fill="#132F52" stroke="#2F6690" stroke-width="1"/>
      <text x="122" y="15.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600" fill="#A9D6E5">GODOT</text>

      <rect x="168" y="0" width="54" height="24" rx="6" fill="#132F52" stroke="#2F6690" stroke-width="1"/>
      <text x="195" y="15.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600" fill="#A9D6E5">C#</text>

      <text x="532" y="16" text-anchor="end" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#7CC2E8">Repo Coming Soon</text>
    </g>
