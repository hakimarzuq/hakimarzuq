<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 250" width="580" height="250" role="img" aria-label="Project 02 - 3D Modeling and Shader Lab">
  <defs>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071324"/>
      <stop offset="100%" stop-color="#112947"/>
    </linearGradient>
    <linearGradient id="headerBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D223D"/>
      <stop offset="100%" stop-color="#245582"/>
    </linearGradient>
    <clipPath id="cardClip2">
      <rect x="1" y="1" width="578" height="248" rx="16"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="578" height="248" rx="16" fill="url(#cardBg2)"/>

  <g clip-path="url(#cardClip2)">
