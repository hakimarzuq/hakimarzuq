    <rect x="0" y="0" width="580" height="96" fill="url(#headerBg2)"/>
    <path d="M 0,96 C 130,72 250,50 380,82 C 470,104 530,68 580,58 L 580,96 Z" fill="#0B192C" fill-opacity="0.75"/>
    <path d="M 0,90 C 135,66 255,44 385,76 C 475,98 532,62 580,52" fill="none" stroke="#F4F8FB" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Isometric Cube Mesh Icon -->
    <g transform="translate(495, 50)" stroke="#A9D6E5" fill="none">
      <polygon points="0,-24 22,-11 22,13 0,26 -22,13 -22,-11" fill="#17385E" fill-opacity="0.6" stroke-width="1.5"/>
      <line x1="0" y1="-24" x2="0" y2="2" stroke-width="1.3"/>
      <line x1="22" y1="-11" x2="0" y2="2" stroke-width="1.3"/>
      <line x1="-22" y1="-11" x2="0" y2="2" stroke-width="1.3"/>
      <line x1="0" y1="2" x2="0" y2="26" stroke-width="1.3"/>
      <circle cx="0" cy="-24" r="2.5" fill="#F4F8FB" stroke="none"/>
      <circle cx="22" cy="-11" r="2.5" fill="#F4F8FB" stroke="none"/>
      <circle cx="-22" cy="-11" r="2.5" fill="#F4F8FB" stroke="none"/>
    </g>

    <!-- Header Pills -->
    <rect x="22" y="18" width="114" height="24" rx="7" fill="#071324" fill-opacity="0.85" stroke="#4A8DB7" stroke-opacity="0.7" stroke-width="1"/>
    <text x="79" y="34" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1" fill="#A9D6E5">ROADMAP / 02</text>

    <rect x="444" y="18" width="112" height="24" rx="12" fill="#0A223D" stroke="#4A8DB7" stroke-width="1"/>
    <circle cx="458" cy="30" r="3.5" fill="#7DD3FC"/>
    <text x="506" y="34" text-anchor="middle" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8" fill="#E0F2FE">IN PROGRESS</text>

    <!-- Body Content -->
    <text x="24" y="130" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#F4F8FB">3D Asset &amp; PBR Modeling Lab</text>
    <text x="24" y="149" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.2" fill="#6BAAD0">3D MODELING  •  LIGHTING  •  OPTIMIZATION</text>

    <text x="24" y="176" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#CBD5E1">Stylized and hard-surface 3D models, lighting studies, and</text>
    <text x="24" y="194" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#CBD5E1">lightweight glTF assets optimized for web and game engines.</text>

    <!-- Footer Tech Tags -->
    <g transform="translate(24, 212)">
