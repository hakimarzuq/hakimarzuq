<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" role="img" aria-label="What I build — 3D Websites, 3D Modeling, Game Dev, Interactive UI">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1045"/>
      <stop offset="55%" stop-color="#171A64"/>
      <stop offset="100%" stop-color="#1D2275"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C8BFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4F5BD5" stop-opacity="0.28"/>
    </linearGradient>
    <radialGradient id="nebula" cx="75%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#6E7BFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0E1045" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="958" height="218" rx="16" fill="url(#panelBg)" stroke="#39429B" stroke-opacity="0.55" stroke-width="1.2"/>
  <rect x="1" y="1" width="958" height="218" rx="16" fill="url(#nebula)"/>

  <!-- Section Heading -->
  <text x="52" y="54" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">What I build</text>

  <!-- Column 1: 3D Websites -->
  <g transform="translate(52, 82)">
    <rect x="0" y="0" width="44" height="44" rx="11" fill="url(#tileGrad)" stroke="#C7D2FE" stroke-opacity="0.45" stroke-width="1.1"/>
    <circle cx="22" cy="22" r="9" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <ellipse cx="22" cy="22" rx="4.2" ry="9" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
    <line x1="13" y1="22" x2="31" y2="22" stroke="#FFFFFF" stroke-width="1.2"/>
    <text x="0" y="72" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#FFFFFF">3D Websites</text>
    <text x="0" y="93" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" fill="#9AA6E8">Three.js &amp; WebGL</text>
  </g>

  <!-- Column 2: 3D Modeling -->
  <g transform="translate(276, 82)">
    <rect x="0" y="0" width="44" height="44" rx="11" fill="url(#tileGrad)" stroke="#C7D2FE" stroke-opacity="0.45" stroke-width="1.1"/>
    <polygon points="22,12 31,17 31,27 22,32 13,27 13,17" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="22" y1="22" x2="31" y2="17" stroke="#FFFFFF" stroke-width="1.3"/>
    <line x1="22" y1="22" x2="13" y2="17" stroke="#FFFFFF" stroke-width="1.3"/>
    <line x1="22" y1="22" x2="22" y2="32" stroke="#FFFFFF" stroke-width="1.3"/>
    <text x="0" y="72" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#FFFFFF">3D Modeling</text>
    <text x="0" y="93" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" fill="#9AA6E8">Blender &amp; PBR Assets</text>
  </g>

  <!-- Column 3: Game Dev -->
  <g transform="translate(500, 82)">
    <rect x="0" y="0" width="44" height="44" rx="11" fill="url(#tileGrad)" stroke="#C7D2FE" stroke-opacity="0.45" stroke-width="1.1"/>
    <rect x="12" y="16" width="20" height="12" rx="6" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="17" y1="19.5" x2="17" y2="24.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="14.5" y1="22" x2="19.5" y2="22" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="25.5" cy="20.8" r="1.1" fill="#FFFFFF"/>
    <circle cx="27.8" cy="23.2" r="1.1" fill="#FFFFFF"/>
    <text x="0" y="72" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#FFFFFF">Game Dev</text>
    <text x="0" y="93" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" fill="#9AA6E8">Unity, Godot &amp; C#</text>
  </g>

  <!-- Column 4: Interactive UI -->
  <g transform="translate(724, 82)">
    <rect x="0" y="0" width="44" height="44" rx="11" fill="url(#tileGrad)" stroke="#C7D2FE" stroke-opacity="0.45" stroke-width="1.1"/>
    <rect x="13" y="13" width="18" height="18" rx="4" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <polyline points="17.5,19 20.5,22 17.5,25" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="22.5" y1="25" x2="26.5" y2="25" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <text x="0" y="72" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#FFFFFF">Interactive UI</text>
    <text x="0" y="93" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" fill="#9AA6E8">TypeScript &amp; React</text>
  </g>
</svg>
