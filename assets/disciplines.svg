<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="960" height="200" role="img" aria-label="Disciplines — 3D Websites, 3D Modeling, Game Dev, Interactive UI">
  <defs>
    <linearGradient id="monoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709"/>
      <stop offset="100%" stop-color="#0E0E11"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="958" height="198" rx="12" fill="url(#monoBg)" stroke="#242428" stroke-width="1"/>

  <!-- Archival Header -->
  <circle cx="44" cy="38" r="3.5" fill="#DC2626"/>
  <text x="58" y="42" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#71717A">DISCIPLINES // FOCUS</text>
  <line x1="40" y1="60" x2="920" y2="60" stroke="#1E1E22" stroke-width="1"/>

  <!-- Vertical Hairline Dividers -->
  <line x1="260" y1="76" x2="260" y2="174" stroke="#1E1E22" stroke-width="1"/>
  <line x1="480" y1="76" x2="480" y2="174" stroke="#1E1E22" stroke-width="1"/>
  <line x1="700" y1="76" x2="700" y2="174" stroke="#1E1E22" stroke-width="1"/>

  <!-- 01: 3D Websites -->
  <g transform="translate(40, 82)">
    <text x="0" y="12" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#52525B">01</text>
    <g transform="translate(0, 24)" stroke="#F5F2E8" fill="none">
      <circle cx="11" cy="11" r="9.5" stroke-width="1.3"/>
      <ellipse cx="11" cy="11" rx="4.5" ry="9.5" stroke-width="1"/>
      <line x1="1.5" y1="11" x2="20.5" y2="11" stroke-width="1"/>
    </g>
    <text x="0" y="72" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#F5F2E8">3D Websites</text>
    <text x="0" y="92" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#8A8A91">Three.js &amp; WebGL</text>
  </g>

  <!-- 02: 3D Modeling -->
  <g transform="translate(284, 82)">
    <text x="0" y="12" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#52525B">02</text>
    <g transform="translate(0, 24)" stroke="#F5F2E8" fill="none">
      <polygon points="11,1 20,6 20,16 11,21 2,16 2,6" stroke-width="1.3" stroke-linejoin="round"/>
      <line x1="11" y1="11" x2="20" y2="6" stroke-width="1.1"/>
      <line x1="11" y1="11" x2="2" y2="6" stroke-width="1.1"/>
      <line x1="11" y1="11" x2="11" y2="21" stroke-width="1.1"/>
    </g>
    <text x="0" y="72" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#F5F2E8">3D Modeling</text>
    <text x="0" y="92" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#8A8A91">Blender &amp; PBR Assets</text>
  </g>

  <!-- 03: Game Dev -->
  <g transform="translate(504, 82)">
    <text x="0" y="12" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#52525B">03</text>
    <g transform="translate(0, 24)" stroke="#F5F2E8" fill="none">
      <rect x="1" y="5" width="20" height="12" rx="6" stroke-width="1.3"/>
      <line x1="6.5" y1="8.5" x2="6.5" y2="13.5" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="4" y1="11" x2="9" y2="11" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="14.5" cy="9.8" r="1" fill="#F5F2E8" stroke="none"/>
      <circle cx="16.8" cy="12.2" r="1" fill="#F5F2E8" stroke="none"/>
    </g>
    <text x="0" y="72" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#F5F2E8">Game Dev</text>
    <text x="0" y="92" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#8A8A91">Unity, Godot &amp; C#</text>
  </g>

  <!-- 04: Interactive UI -->
  <g transform="translate(724, 82)">
    <text x="0" y="12" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#52525B">04</text>
    <g transform="translate(0, 24)" stroke="#F5F2E8" fill="none">
      <rect x="2" y="2" width="18" height="18" rx="3.5" stroke-width="1.3"/>
      <polyline points="6.5,8 9.5,11 6.5,14" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="11.5" y1="14" x2="15.5" y2="14" stroke-width="1.3" stroke-linecap="round"/>
    </g>
    <text x="0" y="72" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#F5F2E8">Interactive UI</text>
    <text x="0" y="92" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#8A8A91">TypeScript &amp; React</text>
  </g>
</svg>
