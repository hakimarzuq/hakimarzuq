<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Adli Hakimarzuq Sabekti - Creative Developer Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050D1A"/>
      <stop offset="45%" stop-color="#0B192C"/>
      <stop offset="100%" stop-color="#17385E"/>
    </linearGradient>
    <linearGradient id="waveDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122B4A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1E4B7A" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="waveMid" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B426B" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#2F6690" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4A8DB7" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="waveFoam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A8DB7" stop-opacity="0.25"/>
      <stop offset="65%" stop-color="#A9D6E5" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#F4F8FB" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#7CC2E8" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#2F6690" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#071324" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F6690" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#A9D6E5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1B426B" stop-opacity="0.8"/>
    </linearGradient>
    <clipPath id="frameClip">
      <rect x="1" y="1" width="1198" height="338" rx="18"/>
    </clipPath>
  </defs>

  <!-- Main Frame -->
  <rect x="1" y="1" width="1198" height="338" rx="18" fill="url(#bgGrad)"/>

  <g clip-path="url(#frameClip)">
    <!-- Subtle perspective grid -->
    <g stroke="#2F6690" stroke-opacity="0.12" stroke-width="1">
      <line x1="0" y1="270" x2="1200" y2="270"/>
      <line x1="0" y1="305" x2="1200" y2="305"/>
      <line x1="120" y1="0" x2="120" y2="340"/>
      <line x1="280" y1="0" x2="280" y2="340"/>
      <line x1="440" y1="0" x2="440" y2="340"/>
      <line x1="600" y1="0" x2="600" y2="340"/>
    </g>

    <!-- Atmospheric Glow -->
    <rect x="0" y="0" width="1200" height="340" fill="url(#glow)"/>

    <!-- Swirling Layered Ocean Waves (right crest inspired by reference #4) -->
    <path d="M 540,340 C 660,250 740,290 830,190 C 905,105 975,135 1045,45 C 1090,-10 1150,-5 1200,15 L 1200,340 Z" fill="url(#waveDeep)"/>
    <path d="M 640,340 C 745,275 815,295 900,205 C 975,125 1045,155 1110,65 C 1145,20 1175,18 1200,35 L 1200,340 Z" fill="url(#waveMid)"/>
    <path d="M 760,340 C 845,295 895,280 965,215 C 1030,155 1085,170 1145,95 C 1170,64 1188,58 1200,68 L 1200,340 Z" fill="#0B192C" fill-opacity="0.55"/>

    <!-- Ice White Crest Highlights -->
    <path d="M 790,340 C 855,285 905,270 970,200 C 1035,130 1090,155 1145,78 C 1172,40 1188,36 1200,48" fill="none" stroke="url(#waveFoam)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 680,340 C 765,268 830,275 910,192 C 980,120 1045,138 1108,54" fill="none" stroke="#A9D6E5" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
    <path d="M 885,340 C 940,295 985,285 1040,225 C 1095,165 1145,180 1200,115" fill="none" stroke="#F4F8FB" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>

    <!-- Subtle Ambient Particles -->
    <circle cx="945" cy="92" r="2.2" fill="#F4F8FB" fill-opacity="0.75"/>
    <circle cx="980" cy="68" r="1.5" fill="#A9D6E5" fill-opacity="0.65"/>
    <circle cx="885" cy="145" r="2" fill="#A9D6E5" fill-opacity="0.5"/>
    <circle cx="1065" cy="195" r="2.5" fill="#F4F8FB" fill-opacity="0.6"/>
    <circle cx="760" cy="240" r="1.8" fill="#7CC2E8" fill-opacity="0.5"/>

    <!-- 3D Isometric Wireframe Cube Emblem (Right Side) -->
    <g transform="translate(995, 148)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-7; 0,0" dur="5s" repeatCount="indefinite"/>
        <!-- Outer Cube -->
        <polygon points="0,-54 47,-27 47,27 0,54 -47,27 -47,-27" fill="#0B192C" fill-opacity="0.45" stroke="#A9D6E5" stroke-width="1.8" stroke-linejoin="round"/>
        <line x1="0" y1="-54" x2="0" y2="0" stroke="#7CC2E8" stroke-width="1.5" stroke-opacity="0.85"/>
        <line x1="47" y1="-27" x2="0" y2="0" stroke="#7CC2E8" stroke-width="1.5" stroke-opacity="0.85"/>
        <line x1="-47" y1="-27" x2="0" y2="0" stroke="#7CC2E8" stroke-width="1.5" stroke-opacity="0.85"/>
        <line x1="0" y1="0" x2="0" y2="54" stroke="#F4F8FB" stroke-width="1.6" stroke-opacity="0.9"/>
        <!-- Inner Core Cube -->
        <polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="#4A8DB7" fill-opacity="0.25" stroke="#F4F8FB" stroke-width="1.2" stroke-opacity="0.75"/>
        <!-- Vertex Nodes -->
        <circle cx="0" cy="-54" r="3" fill="#F4F8FB"/>
        <circle cx="47" cy="-27" r="3" fill="#A9D6E5"/>
        <circle cx="-47" cy="-27" r="3" fill="#A9D6E5"/>
        <circle cx="0" cy="54" r="3" fill="#A9D6E5"/>
        <circle cx="0" cy="0" r="3.5" fill="#F4F8FB"/>
      </g>
      <!-- Orbit Ring -->
      <ellipse cx="0" cy="0" rx="74" ry="22" transform="rotate(-18)" fill="none" stroke="#A9D6E5" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="5 5"/>
    </g>

    <!-- Left Content Block -->
    <g transform="translate(64, 58)">
      <!-- Eyebrow Pill -->
      <rect x="0" y="0" width="335" height="28" rx="14" fill="#122B4A" stroke="#2F6690" stroke-width="1"/>
      <circle cx="18" cy="14" r="4" fill="#7CC2E8"/>
      <text x="32" y="18.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#A9D6E5">CREATIVE DEVELOPER  •  @HAKIMARZUQ</text>

      <!-- Display Name -->
      <text x="0" y="88" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="0.8" fill="#F4F8FB">ADLI HAKIMARZUQ SABEKTI</text>

      <!-- Tagline -->
      <text x="2" y="124" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#B8D8EA">Crafting 3D Websites, 3D Models &amp; Interactive Game Worlds</text>

      <!-- Accent Divider -->
      <rect x="2" y="148" width="96" height="3" rx="1.5" fill="#4A8DB7"/>
      <rect x="106" y="148" width="28" height="3" rx="1.5" fill="#A9D6E5"/>

      <!-- Bottom Interest Pills -->
      <g transform="translate(0, 174)">
        <rect x="0" y="0" width="152" height="34" rx="8" fill="#0E223B" stroke="#2F6690" stroke-width="1.2"/>
        <text x="76" y="21.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600" fill="#E2F1FA">THREE.JS / WEBGL</text>

        <rect x="164" y="0" width="122" height="34" rx="8" fill="#0E223B" stroke="#2F6690" stroke-width="1.2"/>
        <text x="225" y="21.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600" fill="#E2F1FA">BLENDER 3D</text>

        <rect x="298" y="0" width="142" height="34" rx="8" fill="#0E223B" stroke="#2F6690" stroke-width="1.2"/>
        <text x="369" y="21.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600" fill="#E2F1FA">UNITY / GODOT</text>

        <rect x="452" y="0" width="118" height="34" rx="8" fill="#153559" stroke="#4A8DB7" stroke-width="1.2"/>
        <text x="511" y="21.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600" fill="#F4F8FB">TYPESCRIPT</text>
      </g>
    </g>
  </g>

  <!-- Crisp Outer Border -->
  <rect x="1" y="1" width="1198" height="338" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>
</svg>
