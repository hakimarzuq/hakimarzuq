<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 250" width="580" height="250" role="img" aria-label="Project 01 - Interactive 3D Web Showcase">
  <defs>
    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071324"/>
      <stop offset="100%" stop-color="#112947"/>
    </linearGradient>
    <linearGradient id="headerBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1D36"/>
      <stop offset="100%" stop-color="#1E4B7A"/>
    </linearGradient>
    <clipPath id="cardClip1">
      <rect x="1" y="1" width="578" height="248" rx="16"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="578" height="248" rx="16" fill="url(#cardBg1)"/>

  <g clip-path="url(#cardClip1)">
    <!-- Header Visual Zone -->
    <rect x="0" y="0" width="580" height="96" fill="url(#headerBg1)"/>
    <path d="M 0,96 C 140,62 280,112 430,68 C 500,48 545,62 580,50 L 580,96 Z" fill="#0B192C" fill-opacity="0.75"/>
    <path d="M 0,92 C 150,58 290,104 440,60 C 505,40 550,55 580,44" fill="none" stroke="#A9D6E5" stroke-opacity="0.45" stroke-width="1.5"/>

    <!-- Wireframe 3D Globe Icon -->
    <g transform="translate(495, 48)" stroke="#A9D6E5" fill="none">
      <circle cx="0" cy="0" r="26" stroke-opacity="0.8" stroke-width="1.4"/>
      <ellipse cx="0" cy="0" rx="12" ry="26" stroke-opacity="0.5" stroke-width="1.1"/>
      <ellipse cx="0" cy="0" rx="26" ry="9" stroke-opacity="0.5" stroke-width="1.1"/>
      <circle cx="20" cy="-14" r="3" fill="#F4F8FB" stroke="none"/>
    </g>

    <!-- Header Pills -->
    <rect x="22" y="18" width="114" height="24" rx="7" fill="#071324" fill-opacity="0.85" stroke="#4A8DB7" stroke-opacity="0.7" stroke-width="1"/>
    <text x="79" y="34" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1" fill="#A9D6E5">ROADMAP / 01</text>

    <rect x="444" y="18" width="112" height="24" rx="12" fill="#0A223D" stroke="#4A8DB7" stroke-width="1"/>
    <circle cx="458" cy="30" r="3.5" fill="#7DD3FC"/>
    <text x="506" y="34" text-anchor="middle" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8" fill="#E0F2FE">IN PROGRESS</text>

    <!-- Body Content -->
    <text x="24" y="130" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#F4F8FB">Interactive 3D Web Showcase</text>
    <text x="24" y="149" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.2" fill="#6BAAD0">WEBGL  •  SPATIAL INTERFACE  •  PORTFOLIO</text>

    <text x="24" y="176" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#CBD5E1">Exploring real-time 3D web scenes, smooth camera choreography,</text>
    <text x="24" y="194" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#CBD5E1">and custom GLSL shaders directly inside the browser.</text>

    <!-- Footer Tech Tags -->
    <g transform="translate(24, 212)">
      <rect x="0" y="0" width="84" height="24" rx="6" fill="#132F52" stroke="#2F6690" stroke-width="1"/>
      <text x="42" y="15.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600" fill="#A9D6E5">THREE.JS</text>

      <rect x="92" y="0" width="96" height="24" rx="6" fill="#132F52" stroke="#2F6690" stroke-width="1"/>
      <text x="140" y="15.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600" fill="#A9D6E5">TYPESCRIPT</text>

      <rect x="196" y="0" width="66" height="24" rx="6" fill="#132F52" stroke="#2F6690" stroke-width="1"/>
      <text x="229" y="15.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600" fill="#A9D6E5">GLSL</text>

      <text x="532" y="16" text-anchor="end" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#7CC2E8">Repo Coming Soon</text>
    </g>
  </g>

  <rect x="1" y="1" width="578" height="248" rx="16" fill="none" stroke="#2A5780" stroke-width="1.5"/>
</svg>
